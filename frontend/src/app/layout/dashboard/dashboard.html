<div class="page-wrapper">
  <header>
    <div class="header-content">
      <div class="primary-icon">
        <mat-icon class="mat-icon">{{ activeItem()?.icon }}</mat-icon>
      </div>
      <h1 class="page-heading">{{ activeItem()?.label }}</h1>
    </div>
  </header>
  <main class="page-content">
    <mat-tab-nav-panel #tabPanel>
      <router-outlet />
    </mat-tab-nav-panel>

    <div class="action-menu">
      @if (open()) {
        <ul class="actions" id="create-actions">
          <li>
            <a matFab extended routerLink="/user/headache/add" (click)="open.set(false)">
              Headache
            </a>
          </li>
          <li>
            <a matFab extended routerLink="/user/workout/add" (click)="open.set(false)">
              Workout
            </a>
          </li>
        </ul>
      }
      <button
        matFab
        type="button"
        [attr.aria-expanded]="open()"
        aria-controls="create-actions"
        aria-label="Create new entry"
        (click)="open.set(!open())"
        (keydown.escape)="open.set(false)"
      >
        <mat-icon>{{ open() ? 'close' : 'add' }}</mat-icon>
      </button>
    </div>
  </main>

  <nav mat-tab-nav-bar [tabPanel]="tabPanel" headerPosition="below" class="nav-wrapper">
    @for (item of items; track item.path) {
      <a mat-tab-link [routerLink]="item.path" routerLinkActive="active">
        <div class="nav-tab">
          <mat-icon>{{ item.icon }}</mat-icon>
          <span class="label">{{ item.label }}</span>
        </div>
      </a>
    }
  </nav>
</div>
