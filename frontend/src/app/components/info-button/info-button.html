<button
  matIconButton
  type="button"
  [attr.aria-label]="label()"
  aria-haspopup="dialog"
  (click)="open()"
>
  <mat-icon>{{ icon() }}</mat-icon>
</button>

<ng-template #dialog>
  <app-dialog [heading]="heading()" [compactHeading]="compactHeading()">
    <ng-container [ngTemplateOutlet]="content()" />
  </app-dialog>
</ng-template>
