<mat-form-field appearance="outline" [subscriptSizing]="compact() ? 'dynamic' : 'fixed'">
  <mat-label>{{ label() }}</mat-label>
  @if (type() === 'number') {
    <!-- A fixed type="number" is what makes Angular use its number accessor: the control gets a number (or null), not a string -->
    <input
      type="number"
      matInput
      [formControl]="myControl()"
      [attr.placeholder]="placeholder() || null"
    />
  } @else {
    <input
      [type]="hasPassView() && !hide() ? 'text' : type()"
      matInput
      [formControl]="myControl()"
      /* Attribute binding allows to skip it when it's not given */
      [attr.placeholder]="placeholder() || null"
    />
  }

  @if (hasPassView()) {
    <button
      mat-icon-button
      matSuffix
      type="button"
      (click)="clickEvent($event)"
      [attr.aria-label]="hide() ? 'Show password' : 'Hide password'"
      [attr.aria-pressed]="!hide()"
    >
      <mat-icon>{{ hide() ? 'visibility_off' : 'visibility' }}</mat-icon>
    </button>
  }
  @if (getErrorMessage(); as message) {
    <mat-error>{{ message }}</mat-error>
  }
</mat-form-field>
