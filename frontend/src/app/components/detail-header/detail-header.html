<app-page-header [title]="title()">
  @if (editLink() || deleteFn()) {
    <button
      matIconButton
      type="button"
      [matMenuTriggerFor]="menu"
      [attr.aria-label]="title() + ' options'"
    >
      <mat-icon>more_vert</mat-icon>
    </button>
    <mat-menu #menu="matMenu" xPosition="before">
      @if (editLink(); as link) {
        <a mat-menu-item [routerLink]="link">
          <mat-icon>edit</mat-icon>
          <span>Edit</span>
        </a>
      }
      @if (deleteFn()) {
        <button mat-menu-item type="button" (click)="confirmDelete()">
          <mat-icon>delete</mat-icon>
          <span>Delete</span>
        </button>
      }
    </mat-menu>
  }
</app-page-header>
