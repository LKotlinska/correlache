<app-dialog heading="Sign in">
  <form [formGroup]="signInForm" (ngSubmit)="onSubmit()">
    <app-outlined-field
      label="Email"
      type="email"
      placeholder="e.g. john@example.com"
      [myControl]="signInForm.controls.emailFormControl"
    />

    <app-outlined-field
      label="Password"
      type="password"
      [myControl]="signInForm.controls.passwordFormConrol"
      [hasPassView]="true"
    />
    @if (errorMessage()) {
      <p class="form-error" role="alert">{{ errorMessage() }}</p>
    }
    <app-button type="submit" [isFullWidth]="true" [disabled]="isSubmitting()">Sign in</app-button>

    <p class="dialog-foot">
      New here?
      <app-button appearance="text" (click)="switchDialog('signup')"
        >Create your account</app-button
      >
    </p>
  </form>
</app-dialog>
