<app-dialog heading="Create your account">
  <form class="signup-form" [formGroup]="addUserForm" (ngSubmit)="onSubmit()">
    <app-outlined-field
      label="Name"
      type="text"
      placeholder="e.g. John"
      [myControl]="addUserForm.controls.nameFormControl"
    />

    <app-outlined-field
      label="Email"
      type="email"
      placeholder="e.g. john@example"
      [myControl]="addUserForm.controls.emailFormControl"
    />

    <app-outlined-field
      label="Password"
      type="password"
      [myControl]="addUserForm.controls.passwordFormControl"
    />

    <div class="terms-field">
      <mat-checkbox [formControl]="addUserForm.controls.termsFormControl">
        I have read and agree to the Terms of Service and Privacy Policy
      </mat-checkbox>
      <!--
        mat-error only gets its animation inside a mat-form-field, which needs a
        MatFormFieldControl. The hidden input shares the checkbox's control so the
        form field tracks its error state; the visible box itself is hidden in the scss.
      -->
      <mat-form-field class="terms-error-field" subscriptSizing="dynamic">
        <input
          matInput
          type="text"
          tabindex="-1"
          aria-hidden="true"
          [formControl]="addUserForm.controls.termsFormControl"
        />
        <mat-error>This field is required</mat-error>
      </mat-form-field>
    </div>

    <app-button label="Create account" type="submit" [isFullWidth]="true" />
  </form>
  <p class="dialog-foot">Already registered? Sign in</p>
</app-dialog>
