<app-dialog heading="Sign in">
  <form [formGroup]="signInForm" (ngSubmit)="onSubmit()">
    <app-outlined-field
      label="Email"
      type="email"
      placeholder="e.g. john@example.com"
      [myControl]="signInForm.controls.emailFormControl"
    />

    <app-outlined-field
      label="Password"
      type="password"
      [myControl]="signInForm.controls.passwordFormConrol"
    />
    @if (errorMessage()) {
      <p class="form-error" role="alert">{{ errorMessage() }}</p>
    }
    <app-button label="Sign in" type="submit" [isFullWidth]="true" [disabled]="isSubmitting()" />

    <p class="dialog-foot">
      New here?
      <app-button label="Create your account" appearance="text" (click)="switchDialog('signup')" />
    </p>
  </form>
</app-dialog>
