<app-dialog heading="Create your account">
  <form class="signup-form" [formGroup]="addUserForm" (ngSubmit)="onSubmit()">
    <app-outlined-field
      label="Name"
      type="text"
      placeholder="e.g. John"
      [myControl]="addUserForm.controls.nameFormControl"
    />

    <app-outlined-field
      label="Email"
      type="email"
      placeholder="e.g. john@example"
      [myControl]="addUserForm.controls.emailFormControl"
    />

    <app-outlined-field
      label="Password"
      type="password"
      [myControl]="addUserForm.controls.passwordFormControl"
      [hasPassView]="true"
    />

    <div class="checkbox-field">
      <mat-checkbox
        [formControl]="addUserForm.controls.termsFormControl"
        [attr.aria-describedby]="termsInvalid ? 'terms-error' : null"
      >
        I agree to the
        <a href="#" class="text-link" (click)="openOnTop($event, 'terms')">Terms of Service</a>
        and have read the
        <a href="#" class="text-link" (click)="openOnTop($event, 'privacy')">Privacy Policy</a>
      </mat-checkbox>
      @if (termsInvalid) {
        <p id="terms-error" class="checkbox-error" role="alert">
          You must accept the terms to create an account
        </p>
      }
    </div>

    <app-health-consent-checkbox
      [control]="addUserForm.controls.healthConsentFormControl"
      errorMessage="CorrelAche can't store your headache data without this consent"
    />

    <div class="button-container">
      <app-button type="submit" [isFullWidth]="true" [disabled]="isSubmitting()"
        >Create account</app-button
      >
    </div>
  </form>
  <p class="dialog-foot">
    Already registered?
    <app-button appearance="text" (click)="switchDialog('login')">Sign in</app-button>
  </p>
</app-dialog>
