<form [formGroup]="headacheForm">
  <mat-stepper class="stepper" aria-label="Vertical stepper" orientation="vertical" #stepper>
    <mat-step>
      <ng-template matStepLabel>
        <h2>When did it start?</h2>
      </ng-template>
      <div>
        <h3>Start</h3>
        <div class="picker-grid">
          <mat-form-field appearance="outline">
            <mat-label>Pick a date</mat-label>
            <input
              [formControl]="headacheForm.controls.startDate"
              matInput
              [matDatepicker]="startDatePicker"
            />
            <mat-hint>MM/DD/YYYY</mat-hint>
            <mat-datepicker-toggle matIconSuffix [for]="startDatePicker"></mat-datepicker-toggle>
            <mat-datepicker #startDatePicker></mat-datepicker>
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Pick a time</mat-label>
            <input
              [formControl]="headacheForm.controls.startTime"
              matInput
              [matTimepicker]="startTimePicker"
            />
            <mat-timepicker-toggle matIconSuffix [for]="startTimePicker" />
            <mat-timepicker #startTimePicker />
          </mat-form-field>
        </div>
      </div>
      <div>
        <h3>End</h3>
        <div class="picker-grid">
          <mat-form-field appearance="outline">
            <mat-label>Pick a date</mat-label>
            <input
              [formControl]="headacheForm.controls.endDate"
              matInput
              [matDatepickerFilter]="endDateFilter"
              [matDatepicker]="endDatePicker"
            />
            <mat-hint>MM/DD/YYYY</mat-hint>
            <mat-datepicker-toggle matIconSuffix [for]="endDatePicker"></mat-datepicker-toggle>
            <mat-datepicker #endDatePicker></mat-datepicker>
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Pick a time</mat-label>
            <input
              [formControl]="headacheForm.controls.endTime"
              matInput
              [matTimepicker]="timepicker"
            />
            <mat-timepicker-toggle matIconSuffix [for]="timepicker" />
            <mat-timepicker #timepicker />
          </mat-form-field>
        </div>
      </div>
      <div>
        <h3>Pain level</h3>
        <mat-slider class="slider" min="0" max="10" step="1" showTickMarks discrete>
          <input [formControl]="headacheForm.controls.painLevel" matSliderThumb />
        </mat-slider>
      </div>
      <div class="btn-container">
        <button matButton="filled" matStepperNext>Next</button>
      </div>
    </mat-step>

    <mat-step>
      <ng-template matStepLabel>Location</ng-template>

      <div class="btn-container">
        <button matButton="filled" matStepperPrevious>Back</button>
        <button matButton="filled" matStepperNext>Next</button>
      </div>
    </mat-step>

    <mat-step>
      <ng-template matStepLabel>Triggers and symptoms</ng-template>

      <div class="btn-container">
        <button matButton="filled" matStepperPrevious>Back</button>
        <button matButton="filled" matStepperNext>Next</button>
      </div>
    </mat-step>

    <mat-step>
      <ng-template matStepLabel>Done</ng-template>
      <p>You are now done.</p>
      <div>
        <button matButton matStepperPrevious>Back</button>
        <button matButton (click)="stepper.reset()">Reset</button>
      </div>
    </mat-step>
  </mat-stepper>
</form>
