<section class="settings-section">
  <h2>Your medications</h2>
  @if (medications.isLoading()) {
    <mat-progress-bar mode="indeterminate" />
  } @else if (medications.error()) {
    <app-error-message message="Couldn't load your medications." retryable (retry)="medications.reload()" />
  }
  <ul class="settings-list">
    <li>
      <button type="button" class="primary" (click)="openMedication()">Add medication</button>
    </li>
    @for (medication of medications.value() ?? []; track medication.id) {
      <li class="medication-item">
        <button type="button" (click)="openMedication(medication)">
          <span class="medication-name">{{ medication.name }}</span>
          <span class="medication-details">{{ medicationDetails(medication) }}</span>
        </button>
        <button
          matIconButton
          type="button"
          class="remove-medication"
          [attr.aria-label]="'Remove ' + medication.name"
          (click)="confirmRemoveMedication(medication)"
        >
          <mat-icon>delete_outline</mat-icon>
        </button>
      </li>
    }
  </ul>
</section>
<section class="settings-section">
  <h2>Your account</h2>
  <ul class="settings-list">
    <li><button class="destructive" type="button" (click)="signOut()">Sign out</button></li>
    <li>
      <button type="button" [disabled]="exporting()" (click)="downloadData()">Download my data</button>
    </li>
    <!-- Temporary, for public testing -->
    <li>
      <button type="button" [disabled]="loadingExample()" (click)="confirmLoadExampleData()">Load example data</button>
    </li>
    <li>
      <button type="button" (click)="confirmDeleteAccount()">Delete account and data</button>
    </li>
  </ul>
</section>
<section class="settings-section">
  <h2>About Correlache</h2>
  <ul class="settings-list">
    <li><button type="button" (click)="openDialog('terms')">Terms and conditions</button></li>
    <li><button type="button" (click)="openDialog('privacy')">Privacy policy</button></li>
  </ul>
</section>
