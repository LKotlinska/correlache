<section class="settings-section">
  <h2>Your medications</h2>
  @if (medications.isLoading()) {
    <mat-progress-bar mode="indeterminate" />
  } @else if (medications.error()) {
    <app-error-message
      message="Couldn't load your medications."
      retryable
      (retry)="medications.reload()"
    />
  }
  <ul class="settings-list">
    <li>
      <button type="button" class="action-btn" (click)="openMedication()">
        <mat-icon>add</mat-icon>
        Add medication
      </button>
    </li>
    @for (medication of medications.value() ?? []; track medication.id) {
      <li class="medication-item">
        <button class="list-item" type="button" (click)="openMedication(medication)">
          <span class="medication-name">{{ medication.name }}</span>
          <span class="medication-details">{{ medicationDetails(medication) }}</span>
        </button>
        <button
          matIconButton
          type="button"
          class="remove-medication"
          [attr.aria-label]="'Remove ' + medication.name"
          (click)="confirmRemoveMedication(medication)"
        >
          <mat-icon>delete_outline</mat-icon>
        </button>
      </li>
    }
  </ul>
</section>
<section class="settings-section">
  <h2>Your account</h2>
  <ul class="settings-list">
    <li>
      <button class="action-btn" type="button" (click)="signOut()">
        <mat-icon>logout</mat-icon>
        Sign out
      </button>
    </li>
    <li>
      <button class="action-btn" type="button" [disabled]="exporting()" (click)="downloadData()">
        <mat-icon>download</mat-icon>
        Download my data
      </button>
    </li>
    <!-- Temporary, for public testing -->
    <li>
      <button
        class="action-btn"
        type="button"
        [disabled]="loadingExample()"
        (click)="confirmLoadExampleData()"
      >
        <mat-icon>dataset</mat-icon>
        Load example data
      </button>
    </li>
    <li>
      <button class="action-btn destructive" type="button" (click)="confirmDeleteData()">
        <mat-icon>delete_forever</mat-icon>
        Delete data
      </button>
      <button class="action-btn destructive" type="button" (click)="confirmDeleteAccount()">
        <mat-icon>delete_forever</mat-icon>
        Delete account
      </button>
    </li>
  </ul>
</section>
<section class="settings-section">
  <h2>About CorrelAche</h2>
  <ul class="settings-list">
    <li><button type="button" (click)="openDialog('about')">About</button></li>
    <li><button type="button" (click)="openDialog('terms')">Terms and Conditions</button></li>
    <li><button type="button" (click)="openDialog('privacy')">Privacy Policy</button></li>
  </ul>
</section>
