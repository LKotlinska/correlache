<mat-card>
  <mat-card-header>
    <mat-card-title>Headaches by day of the week</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    @if (headaches.hasValue()) {
      @if (list().length) {
        @if (summary(); as s) {
          <div class="summary">
            <p>
              Your headaches most often start on <strong>{{ s.days }}</strong>.
            </p>
          </div>
        }

        <div class="chart-wrap">
          <canvas baseChart type="bar" [data]="chartData()" [options]="chartOptions"></canvas>
        </div>
      } @else {
        <p>No headaches logged in {{ periodLabel() }}.</p>
      }
    } @else if (headaches.error()) {
      <app-error-message message="Couldn't load headache data." compact />
    }
  </mat-card-content>
</mat-card>
