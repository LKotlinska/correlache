<app-page-header title="New workout" />
<main class="page-wrapper">
  <form [formGroup]="workoutForm">
    <mat-stepper class="stepper" aria-label="Vertical stepper" orientation="vertical" #stepper>
      <mat-step>
        <ng-template matStepLabel>
          <h2>When did you train?</h2>
        </ng-template>
        <div>
          <h3>Title</h3>
          <app-outlined-field
            label="Workout title"
            type="text"
            [myControl]="workoutForm.controls.title"
          />
        </div>
        <div>
          <h3>Start</h3>
          <app-date-time-picker
            [dateControl]="workoutForm.controls.startDate"
            [timeControl]="workoutForm.controls.startTime"
            [maxDate]="today"
          />
        </div>
        <div>
          <h3>Duration</h3>
          <div class="duration-grid">
            <app-outlined-field
              label="Hours"
              type="number"
              [myControl]="workoutForm.controls.durationHours"
            />
            <app-outlined-field
              label="Minutes"
              type="number"
              [myControl]="workoutForm.controls.durationMinutes"
            />
          </div>
        </div>
        <div class="btn-container">
          <button matButton="filled" type="button" matStepperNext>Next</button>
        </div>
      </mat-step>

      <mat-step>
        <ng-template matStepLabel>
          <h2>Exercises and sets</h2>
        </ng-template>

        <div class="btn-container">
          <button matButton="filled" type="button" matStepperPrevious>Back</button>
          <button matButton="filled" type="button" matStepperNext>Next</button>
        </div>
      </mat-step>

      <mat-step>
        <ng-template matStepLabel>
          <h2>Save your workout</h2>
        </ng-template>
        <div class="btn-container">
          <app-button type="submit" ngForm="sub">Save</app-button>
        </div>
      </mat-step>
    </mat-stepper>
  </form>
</main>
