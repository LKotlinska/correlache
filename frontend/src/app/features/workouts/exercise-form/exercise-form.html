<!-- ".." goes to the workout form this picker belongs to (add, or :id/edit) -->
<app-page-header title="Add exercises" fallback=".." />
<main class="page-wrapper">
  @if (exercises.isLoading()) {
    <mat-progress-bar mode="indeterminate" />
  } @else if (exercises.error()) {
    <p>Couldn't load exercises.</p>
  } @else if (exercises.value()) {
    <div class="search-row">
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>Search</mat-label>
        <mat-icon matPrefix>search</mat-icon>
        <input matInput type="search" [formControl]="searchControl" />
      </mat-form-field>
      <button matIconButton type="button" aria-label="Filter exercises" (click)="openFilters()">
        <mat-icon>filter_list</mat-icon>
      </button>
    </div>

    <cdk-virtual-scroll-viewport [itemSize]="rowHeight">
      <div class="exercise-wrapper" *cdkVirtualFor="let row of rows()">
        @for (exercise of row; track exercise.id) {
          <app-media-tile
            class="media-tile"
            [image]="exercise.imageName ? '/images/exercises/stills/' + exercise.imageName : null"
            [altText]="exercise.name"
            [title]="exercise.name"
            [subtitle]="exercise.bodyPart.name"
            [checked]="isSelected(exercise.id)"
            (checkedChange)="toggleExercise(exercise.id, $event)"
          />
        }
      </div>
    </cdk-virtual-scroll-viewport>
  }
  <div class="btn-container">
    <button
      matButton="filled"
      type="button"
      (click)="submitExercises()"
      [disabled]="exerciseForm.value.length === 0"
    >
      {{
        exerciseForm.value.length === 1
          ? 'Add 1 exercise'
          : `Add ${exerciseForm.value.length} exercises`
      }}
    </button>
  </div>
</main>
