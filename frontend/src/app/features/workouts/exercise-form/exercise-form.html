<!-- ".." goes to the workout form this picker belongs to (add, or :id/edit) -->
<app-page-header title="Add exercises" fallback=".." />
<main class="page-wrapper">
  @if (exercises.isLoading()) {
    <mat-progress-bar mode="indeterminate" />
  } @else if (exercises.error()) {
    <app-error-message message="Couldn't load exercises." retryable (retry)="exercises.reload()" />
  } @else if (exercises.value()) {
    <div class="search-row">
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>Search</mat-label>
        <mat-icon matPrefix>search</mat-icon>
        <input matInput type="search" [formControl]="searchControl" />
      </mat-form-field>
      <button
        matIconButton
        type="button"
        [attr.aria-label]="
          activeFilterCount() ? `Filter exercises, ${activeFilterCount()} active` : 'Filter exercises'
        "
        (click)="openFilters()"
      >
        <mat-icon
          [matBadge]="activeFilterCount()"
          [matBadgeHidden]="activeFilterCount() === 0"
          >filter_list</mat-icon
        >
      </button>
    </div>

    @if (items().length === 0) {
      <div class="empty-state">
        <p>No exercises match.</p>
        @if (activeFilterCount()) {
          <button matButton type="button" (click)="clearFilters()">Clear filters</button>
        }
      </div>
    } @else {
      <cdk-virtual-scroll-viewport [itemSize]="rowHeight">
        <div class="exercise-wrapper" *cdkVirtualFor="let row of rows()">
          @for (exercise of row; track exercise.id) {
            <app-media-tile
              class="media-tile"
              [image]="stillUrl(exercise.imageName)"
              [altText]="exercise.name"
              [title]="exercise.name"
              [subtitle]="exercise.bodyPart.name"
              [animation]="animationUrl(exercise.gifName)"
              [checked]="isSelected(exercise.id)"
              (checkedChange)="toggleExercise(exercise.id, $event)"
            />
          }
        </div>
      </cdk-virtual-scroll-viewport>
    }
  }
  <div class="btn-container">
    <button
      matButton="filled"
      type="button"
      (click)="submitExercises()"
      [disabled]="exerciseForm.value.length === 0"
    >
      {{
        exerciseForm.value.length === 1
          ? 'Add 1 exercise'
          : `Add ${exerciseForm.value.length} exercises`
      }}
    </button>
  </div>
</main>
